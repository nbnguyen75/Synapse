server:
  port: ${PORT:8082}
  tomcat:
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:20000}
    threads:
      max: ${TOMCAT_MAX_THREADS:200}

spring:
  main:
    lazy-initialization: true
    banner-mode: off
  jmx:
    enabled: false
  threads:
    virtual:
      enabled: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/notes_db}
    username: ${SPRING_DATASOURCE_USERNAME:synapse}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 5000
      leak-detection-threshold: 30000
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    virtual-host: ${SPRING_RABBITMQ_VHOST:synapse-vhost}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URL:http://auth:5001/.well-known/jwks.json}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    enable:
      all: false

logging:
  level:
    root: INFO
    "[org.hibernate]": WARN
    "[org.springframework.boot.autoconfigure]": WARN
