server:
  port: ${PORT:8082}
  tomcat:
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:20000}
    threads:
      max: ${TOMCAT_MAX_THREADS:200}

spring:
  main:
    lazy-initialization: true
    banner-mode: off
  jmx:
    enabled: false
  threads:
    virtual:
      enabled: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5433/notes_db}
    username: ${SPRING_DATASOURCE_USERNAME:synapse}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:0}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URL:http://auth:5001/.well-known/jwks.json}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    enable:
      all: false

logging:
  level:
    root: INFO
    "[org.hibernate]": WARN
    "[org.springframework.boot.autoconfigure]": WARN
