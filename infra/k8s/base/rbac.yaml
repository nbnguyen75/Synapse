apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-watcher-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-watcher-role
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-watcher-binding
subjects:
  - kind: ServiceAccount
    name: job-watcher-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: job-watcher-role
  apiGroup: rbac.authorization.k8s.io