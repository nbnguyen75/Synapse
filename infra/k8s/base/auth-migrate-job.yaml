apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  labels:
    app: auth-migrate
spec:
  template:
    metadata:
      labels:
        app: auth-migrate
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z postgres 5432; do echo waiting for postgres...; sleep 2; done;",
            ]
      containers:
        - name: synapse-auth-migrate
          image: auth-migrate
          imagePullPolicy: IfNotPresent
          args:
            - bun
            - --bun
            - db:push
          envFrom:
            - secretRef:
                name: auth-secrets
      restartPolicy: OnFailure
