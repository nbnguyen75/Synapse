apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kong
  name: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: kong
    spec:
      initContainers:
        - name: wait-for-auth
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z auth 5001; do echo waiting for auth...; sleep 2; done;",
            ]
        - name: wait-for-notes
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z notes 8082; do echo waiting for notes...; sleep 2; done;",
            ]
        - name: wait-for-ai
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z ai 5002; do echo waiting for ai...; sleep 2; done;",
            ]
      containers:
        - env:
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.yml
            - name: KONG_MEM_CACHE_SIZE
              value: 32m
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "1"
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
          image: kong:3.7
          name: synapse-kong
          ports:
            - containerPort: 8000
              protocol: TCP
            - containerPort: 8001
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - mountPath: /kong/declarative/kong.yml
              name: kong-cm0
              readOnly: true
              subPath: kong.yml
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: kong.yml
                path: kong.yml
            name: kong-cm0
          name: kong-cm0
