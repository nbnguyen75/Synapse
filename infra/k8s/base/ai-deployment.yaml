apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ai
  name: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z postgres 5432; do echo waiting for postgres...; sleep 2; done;",
            ]
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z rabbitmq 5672; do echo waiting for rabbitmq...; sleep 2; done;",
            ]
      containers:
        - envFrom:
            - secretRef:
                name: ai-secrets
          image: ai
          name: synapse-ai
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always
