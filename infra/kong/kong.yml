_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth:5001
    routes:
      - name: auth-route
        paths:
          - /api/v1/auth
        strip_path: true

  - name: notes-service
    url: http://notes:8082
    routes:
      - name: notes-route
        paths:
          - /api/v1/notes
        strip_path: true

  - name: ai-service
    url: http://ai:5002
    routes:
      - name: ai-route
        paths:
          - /api/v1/ai
        strip_path: true

    plugins:
      - name: rate-limiting
        route: ai-route
        config:
          minute: 5          # mỗi user tối đa 5 request/phút qua chat
          policy: local
          limit_by: credential 
      - name: cors
        config:
          origins:
            - http://localhost:5173
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Origin
          exposed_headers:
            - X-Conversation-Id
          credentials: true
          preflight_continue: false
