_format_version: "3.0"
_transform: true

plugins:
  - name: cors
    config:
      origins: 
        - http://localhost:5173
        - http://127.0.0.1:5173
        - http://localhost:4173
        - http://127.0.0.1:4173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Type
        - Authorization
        - X-Requested-With
        - X-Request-Id
      exposed_headers:
        - X-Conversation-Id
        - X-Accel-Buffering
        - X-Request-Id
        - X-RateLimit-Limit-Minute
        - X-RateLimit-Remaining-Minute
        - Retry-After
      credentials: true
      max_age: 3600
      preflight_continue: false

  - name: rate-limiting
    config:
      minute: 100
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: rate-limiting
    route: ai-route
    config:
      minute: 15
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: response-transformer
    config:
      remove:
        headers:
          - Via
          - X-Kong-Upstream-Latency
          - X-Kong-Proxy-Latency
          - X-Kong-Request-Id

services:
  - name: auth-service
    url: http://auth:5001
    retries: 0
    routes:
      - name: auth-route
        paths:
          - /api/v1/auth
        strip_path: true
        preserve_host: false

  - name: notes-service
    url: http://notes:8082
    routes:
      - name: notes-route
        paths:
          - /api/v1/notes
        strip_path: true
        preserve_host: false

  - name: ai-service
    url: http://ai:5002
    routes:
      - name: ai-route
        paths:
          - /api/v1/ai
        strip_path: true
        preserve_host: false
