services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapse-postgres
    restart: unless-stopped
    env_file:
      - ./infra/docker/postgres/.env.docker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U synapse -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks:
      - synapse-net

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    container_name: synapse-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks:
      - synapse-net

  auth-migrate:
    build:
      context: ./services/auth
      target: migrate
    container_name: synapse-auth-migrate
    command: [ "bun", "--bun", "db:push" ]
    env_file:
      - ./services/auth/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synapse-net

  auth-seed:
    build:
      context: ./services/auth
      target: migrate
    container_name: synapse-auth-seed
    command: [ "bun", "--bun", "run", "./seed/demo-account.ts" ]
    env_file:
      - ./services/auth/.env.docker
    environment:
      SEED_DEMO_ACCOUNT: "true"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    networks:
      - synapse-net

  auth:
    build:
      context: ./services/auth
      target: app
    container_name: synapse-auth
    restart: unless-stopped
    env_file:
      - ./services/auth/.env.docker
    ports:
      - "5001:5001"
    depends_on:
      auth-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 96m
    networks:
      - synapse-net

  ai-migrate:
    build:
      context: ./services/ai
      target: migrate
    container_name: synapse-ai-migrate
    command: [ "bun", "--bun", "db:push" ]
    env_file:
      - ./services/ai/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synapse-net

  ai:
    build:
      context: ./services/ai
      target: app
    container_name: synapse-ai
    restart: unless-stopped
    env_file:
      - ./services/ai/.env.docker
    ports:
      - "5002:5002"
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 512m
    mem_reservation: 128m
    networks:
      - synapse-net

  notes:
    build:
      context: ./services/notes
    container_name: synapse-notes
    restart: unless-stopped
    env_file:
      - ./services/notes/.env.docker
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
      ai:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - synapse-net

  api-gateway:
    image: kong:3.9.3
    container_name: synapse-api-gateway
    restart: unless-stopped
    environment:
      KONG_MEM_CACHE_SIZE: "32m"
      KONG_DATABASE: "off"
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./infra/docker/kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000" # proxy
      - "8001:8001" # admin API
    depends_on:
      - auth
      - notes
      - ai
    mem_limit: 256m
    mem_reservation: 128m
    networks:
      - synapse-net

volumes:
  pgdata:
  rabbitmq-data:

networks:
  synapse-net:
    driver: bridge
