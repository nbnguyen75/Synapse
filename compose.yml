services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U synapse -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synapse-net

  auth:
    build:
      context: ./services/auth
    container_name: synapse-auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://synapse:root@postgres:5432/auth_db
      BETTER_AUTH_URL: http://auth:5001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_TRUST_ORIGINS: ${BETTER_AUTH_TRUST_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PORT: 5001
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synapse-net

  notes:
    build:
      context: ./services/notes
    container_name: synapse-notes
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notes_db
      SPRING_DATASOURCE_USERNAME: synapse
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth:5001/api/auth/.well-known/jwks.json
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synapse-net

  kong:
    image: kong:3.7
    container_name: synapse-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./infra/kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000" # proxy — client gọi vào đây
      - "8001:8001" # admin API — dùng để debug
    depends_on:
      - auth
      - notes
    networks:
      - synapse-net

volumes:
  pgdata:

networks:
  synapse-net:
    driver: bridge
