services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapse-postgres
    restart: unless-stopped
    env_file:
      - ./infra/postgres/.env.docker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U synapse -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synapse-net

  auth-migrate:
    build:
      context: ./services/auth
      target: migrate
    container_name: synapse-auth-migrate
    command: [ "bun", "--bun", "db:push" ]
    env_file:
      - ./services/auth/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synapse-net

  auth-seed:
    build:
      context: ./services/auth
      target: migrate
    container_name: synapse-auth-seed
    command: [ "bun", "--bun", "run", "./seed/demo-account.ts" ]
    env_file:
      - ./services/auth/.env.docker
    environment:
      SEED_DEMO_ACCOUNT: "true"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    networks:
      - synapse-net

  auth:
    build:
      context: ./services/auth
      target: app
    container_name: synapse-auth
    restart: unless-stopped
    env_file:
      - ./services/auth/.env.docker
    ports:
      - "5001:5001"
    depends_on:
      auth-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - synapse-net

  ai-migrate:
    build:
      context: ./services/ai
      target: migrate
    container_name: synapse-ai-migrate
    command: [ "bun", "--bun", "db:push" ]
    env_file:
      - ./services/ai/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synapse-net

  ai:
    build:
      context: ./services/ai
      target: app
    container_name: synapse-ai
    restart: unless-stopped
    env_file:
      - ./services/ai/.env.docker
    ports:
      - "5002:5002"
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - synapse-net

  notes:
    build:
      context: ./services/notes
    container_name: synapse-notes
    restart: unless-stopped
    env_file:
      - ./services/notes/.env.docker
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synapse-net

  kong:
    image: kong:3.7
    container_name: synapse-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./infra/kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000" # proxy
      - "8001:8001" # admin API
    depends_on:
      - auth
      - notes
      - ai
    networks:
      - synapse-net

volumes:
  pgdata:

networks:
  synapse-net:
    driver: bridge
