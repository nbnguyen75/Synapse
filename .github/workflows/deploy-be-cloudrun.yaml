name: Build and Deploy Backend & Kong Gateway to Cloud Run

on:
  push:
    tags:
      - "be-v*"

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPO: ${{ vars.GAR_REPO }}

jobs:
  build-and-deploy-be-to-cloud-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6.1.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      # ==========================================
      # 1. BUILD & PUSH ALL DOCKER IMAGES
      # ==========================================
      - name: Build and Push Docker Images
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"

          docker build --target app -t $REGISTRY/auth:$TAG ./services/auth
          docker push $REGISTRY/auth:$TAG

          docker build --target migrate -t $REGISTRY/auth-migrate:$TAG ./services/auth
          docker push $REGISTRY/auth-migrate:$TAG

          docker build --target app -t $REGISTRY/ai:$TAG ./services/ai
          docker push $REGISTRY/ai:$TAG

          docker build --target migrate -t $REGISTRY/ai-migrate:$TAG ./services/ai
          docker push $REGISTRY/ai-migrate:$TAG

          docker build -t $REGISTRY/notes:$TAG ./services/notes
          docker push $REGISTRY/notes:$TAG

      # ==========================================
      # 2. AUTH SERVICE: MIGRATE (DIRECT) & DEPLOY (POOLED)
      # ==========================================
      - name: Run Auth DB Migration
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"

          gcloud run jobs deploy auth-migrate \
            --image $REGISTRY/auth-migrate:$TAG \
            --region ${{ env.GAR_LOCATION }} \
            --set-env-vars "DATABASE_URL=${{ secrets.NEON_AUTH_DIRECT_URL }}" \
            --max-retries 0 \
            --task-timeout 300

          gcloud run jobs execute auth-migrate --region ${{ env.GAR_LOCATION }} --wait

      - name: Deploy Auth Service
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"

          gcloud run deploy synapse-auth \
            --image $REGISTRY/auth:$TAG \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --port 5001 \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 1 \
            --allow-unauthenticated \
            --set-env-vars "^@^DATABASE_URL=${{ secrets.NEON_AUTH_POOLED_URL }}@BETTER_AUTH_SECRET=${{ secrets.AUTH_BETTER_AUTH_SECRET }}@GOOGLE_CLIENT_ID=${{ secrets.AUTH_GOOGLE_CLIENT_ID }}@GOOGLE_CLIENT_SECRET=${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}@ORIGINS=${{ secrets.CLIENT_ORIGINS }}"

      - name: Fetch Auth Service URL
        run: |
          AUTH_URL=$(gcloud run services describe synapse-auth --region ${{ env.GAR_LOCATION }} --format='value(status.url)')
          echo "AUTH_URL=$AUTH_URL" >> $GITHUB_ENV

      # ==========================================
      # 3. AI SERVICE: MIGRATE (DIRECT) & DEPLOY (POOLED)
      # ==========================================
      - name: Run AI DB Migration
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"

          gcloud run jobs deploy ai-migrate \
            --image $REGISTRY/ai-migrate:$TAG \
            --region ${{ env.GAR_LOCATION }} \
            --set-env-vars "DATABASE_URL=${{ secrets.NEON_AI_DIRECT_URL }}" \
            --max-retries 0 \
            --task-timeout 300

          gcloud run jobs execute ai-migrate --region ${{ env.GAR_LOCATION }} --wait

      - name: Deploy AI Service
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"

          gcloud run deploy synapse-ai \
            --image $REGISTRY/ai:$TAG \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --port 5002 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 1 \
            --allow-unauthenticated \
            --set-env-vars "^@^DATABASE_URL=${{ secrets.NEON_AI_POOLED_URL }}@RABBITMQ_URL=${{ secrets.CLOUDAMQP_URL }}@AUTH_JWKS_URL=${{ env.AUTH_URL }}/.well-known/jwks.json@ORIGINS=${{ secrets.CLIENT_ORIGINS }}@GOOGLE_GENERATIVE_AI_API_KEY=${{ secrets.AI_GOOGLE_GENERATIVE_AI_API_KEY }}@TAVILY_API_KEY=${{ secrets.AI_TAVILY_API_KEY }}"

      - name: Fetch AI Service URL
        run: |
          AI_URL=$(gcloud run services describe synapse-ai --region ${{ env.GAR_LOCATION }} --format='value(status.url)')
          echo "AI_URL=$AI_URL" >> $GITHUB_ENV

      # ==========================================
      # 4. NOTES SERVICE DEPLOY
      # ==========================================
      - name: Deploy Notes Service
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"

          gcloud run deploy synapse-notes \
            --image $REGISTRY/notes:$TAG \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --port 8082 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 1 \
            --allow-unauthenticated \
            --set-env-vars "SPRING_DATASOURCE_URL=${{ secrets.NEON_NOTES_DB_URL }},SPRING_DATASOURCE_USERNAME=${{ secrets.NEON_NOTES_DB_USER }},SPRING_DATASOURCE_PASSWORD=${{ secrets.NEON_NOTES_DB_PASS }},SPRING_RABBITMQ_HOST=${{ secrets.CLOUDAMQP_HOST }},SPRING_RABBITMQ_PORT=5671,SPRING_RABBITMQ_USERNAME=${{ secrets.CLOUDAMQP_USER }},SPRING_RABBITMQ_PASSWORD=${{ secrets.CLOUDAMQP_PASS }},SPRING_RABBITMQ_VHOST=${{ secrets.CLOUDAMQP_VHOST }},SPRING_RABBITMQ_SSL_ENABLED=true,AUTH_JWKS_URL=${{ env.AUTH_URL }}/.well-known/jwks.json,SYNAPSE_AI_SERVICE_URL=${{ env.AI_URL }}"

      # ==========================================
      # 5. KONG GATEWAY CONFIG & DEPLOY
      # ==========================================
      - name: Generate Kong Configuration
        run: |
          export AUTH_SERVICE_URL=${{ env.AUTH_URL }}
          export AI_SERVICE_URL=${{ env.AI_URL }}
          export NOTES_SERVICE_URL=$(gcloud run services describe synapse-notes --region ${{ env.GAR_LOCATION }} --format='value(status.url)')

          export CORS_ORIGINS_FORMATTED=$(echo "${{ secrets.CLIENT_ORIGINS }}" | tr ',' '\n' | sed 's/^/        - "/' | sed 's/$/"/')

          envsubst < ./infra/docker/kong/kong.template.yml > ./infra/docker/kong/kong.yml

      - name: Build and Deploy Kong Gateway
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"

          docker build -t $REGISTRY/kong:$TAG ./infra/docker/kong
          docker push $REGISTRY/kong:$TAG

          gcloud run deploy synapse-kong \
            --image $REGISTRY/kong:$TAG \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --port 8000 \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 1 \
            --allow-unauthenticated \
            --set-env-vars "KONG_DATABASE=off,KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yml,KONG_PROXY_LISTEN=0.0.0.0:8000"

      # ==========================================
      # 6. UPDATE AUTH WITH FINAL KONG URL (must run last)
      # ==========================================
      - name: Update Auth with Kong URL
        run: |
          KONG_URL=$(gcloud run services describe synapse-kong --region ${{ env.GAR_LOCATION }} --format='value(status.url)')

          gcloud run services update synapse-auth \
            --region ${{ env.GAR_LOCATION }} \
            --min-instances 0 \
            --max-instances 1 \
            --update-env-vars "BETTER_AUTH_URL=$KONG_URL"
