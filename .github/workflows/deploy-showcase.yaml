name: "Ship to Prod 🚀 | GCP Cloud Run & Vercel"

on:
  push:
    tags:
      - "be-v*"
      - "web-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where are we pushing bugs today?"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend-all
          - web
          - auth
          - ai
          - notes
          - api-gateway

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPO: ${{ vars.GAR_REPO }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

jobs:
  setup:
    name: "🧭 Divination | Guessing Our Own URLs"
    runs-on: ubuntu-latest
    outputs:
      auth_url: ${{ steps.build_urls.outputs.auth_url }}
      ai_url: ${{ steps.build_urls.outputs.ai_url }}
      notes_url: ${{ steps.build_urls.outputs.notes_url }}
      gateway_url: ${{ steps.build_urls.outputs.gateway_url }}
      auth_jwks_url: ${{ steps.build_urls.outputs.auth_jwks_url }}
    steps:
      - name: Build Deterministic URLs
        id: build_urls
        run: |
          PROJECT_NUMBER=$(echo "${{ vars.GCP_PROJECT_NUMBER }}" | tr -d '[:space:]')
          REGION=$(echo "${{ env.GAR_LOCATION }}" | tr -d '[:space:]')

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "::error::GCP_PROJECT_NUMBER variable is empty — set it in repo variables"
            exit 1
          fi
          if [ -z "$REGION" ]; then
            echo "::error::GAR_LOCATION var is empty"
            exit 1
          fi

          echo "auth_url=https://synapse-auth-${PROJECT_NUMBER}.${REGION}.run.app" >> $GITHUB_OUTPUT
          echo "ai_url=https://synapse-ai-${PROJECT_NUMBER}.${REGION}.run.app" >> $GITHUB_OUTPUT
          echo "notes_url=https://synapse-notes-${PROJECT_NUMBER}.${REGION}.run.app" >> $GITHUB_OUTPUT
          echo "gateway_url=https://synapse-api-gateway-${PROJECT_NUMBER}.${REGION}.run.app" >> $GITHUB_OUTPUT
          echo "auth_jwks_url=https://synapse-api-gateway-${PROJECT_NUMBER}.${REGION}.run.app/api/v1/auth/.well-known/jwks.json" >> $GITHUB_OUTPUT

  # ───────────────────────── BUILD PHASE ─────────────────────────

  build-auth-service:
    name: '🔐 Build | "Trust me, I hash passwords correctly"'
    needs: [setup]
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'backend-all' || inputs.target == 'auth' }}
    runs-on: ubuntu-latest
    steps:
      - name: Pray and Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: "[Auth] Turning Bun into Docker Layers"
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"
          docker build --target app -t $REGISTRY/auth:$TAG ./services/auth
          docker push $REGISTRY/auth:$TAG

      - name: "[Auth] DB Migration (YOLO mode)"
        env:
          DATABASE_URL: ${{ secrets.NEON_AUTH_DIRECT_URL }}
        run: |
          cd services/auth
          bun install
          bun run db:push

  build-ai-service:
    name: "🤖 Build | Artificial Unintelligence"
    needs: [setup]
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'backend-all' || inputs.target == 'ai' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: "[AI] Build & Push (Hope the model still likes us)"
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"
          docker build --target app -t $REGISTRY/ai:$TAG ./services/ai
          docker push $REGISTRY/ai:$TAG

      - name: "[AI] DB Migration (Hope no deadlock)"
        env:
          DATABASE_URL: ${{ secrets.NEON_AI_DIRECT_URL }}
        run: |
          cd services/ai
          bun install
          bun run db:push

  build-notes-service:
    name: "📝 Build | Java Memory Eater ☕"
    needs: [setup]
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'backend-all' || inputs.target == 'notes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: "[Notes] Build & Push Spring Boot Monster"
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"
          docker build -t $REGISTRY/notes:$TAG ./services/notes
          docker push $REGISTRY/notes:$TAG

  build-api-gateway-service:
    name: "🌐 Build | Kong Gateway, Traffic Cop 🚦"
    needs: [setup]
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'backend-all' || inputs.target == 'api-gateway' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Templating Kong Config (envsubst go brrr)
        run: |
          export AUTH_SERVICE_URL=$(echo "${{ needs.setup.outputs.auth_url }}" | tr -d '[:space:]')
          export AI_SERVICE_URL=$(echo "${{ needs.setup.outputs.ai_url }}" | tr -d '[:space:]')
          export NOTES_SERVICE_URL=$(echo "${{ needs.setup.outputs.notes_url }}" | tr -d '[:space:]')

          if [ -z "$AUTH_SERVICE_URL" ] || [ -z "$AI_SERVICE_URL" ] || [ -z "$NOTES_SERVICE_URL" ]; then
            echo "::error::Một trong các URL bị rỗng! AUTH='$AUTH_SERVICE_URL', AI='$AI_SERVICE_URL', NOTES='$NOTES_SERVICE_URL'"
            exit 1
          fi

          CLIENT_ORIGINS_RAW="${{ secrets.CLIENT_ORIGINS }}"
          if [ -n "$CLIENT_ORIGINS_RAW" ]; then
            export CORS_ORIGINS_FORMATTED=$(echo "$CLIENT_ORIGINS_RAW" | jq -c -R 'split(",")')
          else
            export CORS_ORIGINS_FORMATTED='["*"]'
          fi

          envsubst '$AUTH_SERVICE_URL $AI_SERVICE_URL $NOTES_SERVICE_URL $CORS_ORIGINS_FORMATTED' \
            < ./infra/docker/kong/kong.template.yml > ./infra/docker/kong/kong.yml

          echo "=== GENERATED KONG.YML ==="
          cat ./infra/docker/kong/kong.yml

      - name: "[Gateway] Build & Push (config baked in, no take-backs)"
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"
          docker build -t $REGISTRY/api-gateway:$TAG ./infra/docker/kong
          docker push $REGISTRY/api-gateway:$TAG

  # ───────────────────────── DEPLOY PHASE ─────────────────────────

  deploy-auth-service:
    name: '🔐 Deploy | "It works on my container"'
    needs: [setup, build-auth-service]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: "[Auth] Deploy to Cloud Run (synapse-auth)"
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"
          gcloud run deploy synapse-auth \
            --image $REGISTRY/auth:$TAG \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --port 5001 \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 1 \
            --ingress internal \
            --network default \
            --subnet default \
            --vpc-egress private-ranges-only \
            --allow-unauthenticated \
            --set-env-vars "^@@@^DATABASE_URL=${{ secrets.NEON_AUTH_DIRECT_URL }}@@@BETTER_AUTH_SECRET=${{ secrets.AUTH_BETTER_AUTH_SECRET }}@@@GOOGLE_CLIENT_ID=${{ secrets.AUTH_GOOGLE_CLIENT_ID }}@@@GOOGLE_CLIENT_SECRET=${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}@@@BETTER_AUTH_URL=${{ vars.VERCEL_APP_URL }}"

  deploy-ai-service:
    name: "🤖 Deploy | Send It to Production and Pray"
    needs: [setup, deploy-auth-service, build-ai-service]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: "[AI] Deploy to Cloud Run (synapse-ai)"
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"
          gcloud run deploy synapse-ai \
            --image $REGISTRY/ai:$TAG \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --port 5002 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 1 \
            --ingress internal \
            --network default \
            --subnet default \
            --vpc-egress private-ranges-only \
            --allow-unauthenticated \
            --set-env-vars "^@@@^DATABASE_URL=${{ secrets.NEON_AI_POOLED_URL }}@@@RABBITMQ_URL=${{ secrets.CLOUDAMQP_URL }}@@@AUTH_JWKS_URL=${{ needs.setup.outputs.auth_jwks_url }}@@@ORIGINS=${{ secrets.CLIENT_ORIGINS }}@@@GOOGLE_GENERATIVE_AI_API_KEY=${{ secrets.AI_GOOGLE_GENERATIVE_AI_API_KEY }}@@@TAVILY_API_KEY=${{ secrets.AI_TAVILY_API_KEY }}"

  deploy-notes-service:
    name: "📝 Deploy | May the Garbage Collector Have Mercy"
    needs: [setup, deploy-auth-service, deploy-ai-service, build-notes-service]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: "[Notes] Deploy to Cloud Run (synapse-notes)"
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"
          gcloud run deploy synapse-notes \
            --image $REGISTRY/notes:$TAG \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --port 8082 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 1 \
            --ingress internal \
            --network default \
            --subnet default \
            --vpc-egress private-ranges-only \
            --allow-unauthenticated \
            --set-env-vars "^@@@^SPRING_DATASOURCE_URL=${{ secrets.NEON_NOTES_DB_URL }}@@@SPRING_DATASOURCE_USERNAME=${{ secrets.NEON_NOTES_DB_USER }}@@@SPRING_DATASOURCE_PASSWORD=${{ secrets.NEON_NOTES_DB_PASS }}@@@HIKARI_MAXIMUM_POOL_SIZE=2@@@HIKARI_MINIMUM_IDLE=1@@@HIKARI_CONNECTION_TIMEOUT=10000@@@SPRING_RABBITMQ_HOST=${{ secrets.CLOUDAMQP_HOST }}@@@SPRING_RABBITMQ_PORT=5671@@@SPRING_RABBITMQ_USERNAME=${{ secrets.CLOUDAMQP_USER }}@@@SPRING_RABBITMQ_PASSWORD=${{ secrets.CLOUDAMQP_PASS }}@@@SPRING_RABBITMQ_VHOST=${{ secrets.CLOUDAMQP_VHOST }}@@@SPRING_RABBITMQ_SSL_ENABLED=true@@@AUTH_JWKS_URL=${{ needs.setup.outputs.auth_jwks_url }}@@@SYNAPSE_AI_SERVICE_URL=${{ needs.setup.outputs.ai_url }}"

  deploy-api-gateway-service:
    name: "🌐 Deploy | Kong, Now Guarding the Gates"
    needs:
      [
        setup,
        deploy-auth-service,
        deploy-ai-service,
        deploy-notes-service,
        build-api-gateway-service,
      ]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: "[Gateway] Deploy to Cloud Run (synapse-api-gateway)"
        run: |
          REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          TAG="${{ github.ref_name }}"
          gcloud run deploy synapse-api-gateway \
            --image $REGISTRY/api-gateway:$TAG \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --port 8000 \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 1 \
            --ingress all \
            --network default \
            --subnet default \
            --vpc-egress all-traffic \
            --allow-unauthenticated \
            --set-env-vars "^@@@^KONG_DATABASE=off@@@KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yml@@@KONG_PROXY_LISTEN=0.0.0.0:8000@@@KONG_NGINX_PROXY_PROXY_BUFFER_SIZE=16k@@@KONG_NGINX_PROXY_PROXY_BUFFERS=4 16k@@@KONG_VIA_HEADER=off@@@KONG_HEADERS=off"

      # - name: Patch Auth Service with Vercel Domain (the plot twist)
      #   run: |
      #     gcloud run services update synapse-auth \
      #       --region ${{ env.GAR_LOCATION }} \
      #       --min-instances 0 \
      #       --max-instances 1 \
      #       --update-env-vars "BETTER_AUTH_URL=${{ needs.setup.outputs.gateway_url }}"

  deploy-web-to-vercel:
    name: '📐 Deploy | "CSS is my passion" 🎨'
    needs: [setup]
    if: ${{ startsWith(github.ref_name, 'web-v') || startsWith(github.ref_name, 'v') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'web')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Generate vercel.json dynamically (rewrites, not prayers)
        run: |
          mkdir -p ./client
          cat <<EOF > ./client/vercel.json
          {
            "rewrites": [
              {
                "source": "/api/v1/auth/:path*",
                "destination": "${{ needs.setup.outputs.gateway_url }}/api/v1/auth/:path*"
              },
              {
                "source": "/((?!api/).*)",
                "destination": "/index.html"
              }
            ]
          }
          EOF

          echo "Generated vercel.json:"
          cat ./client/vercel.json

      - name: Download node_modules (Downloading the entire Internet)
        working-directory: ./client
        run: |
          bun install --frozen-lockfile
          bun install --global vercel@latest

      - name: Ship Frontend to Vercel
        working-directory: ./client
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

          RAW_TAG="${{ github.ref_name }}"
          TAG_NAME="${RAW_TAG#web-}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VITE_APP_VERSION=${TAG_NAME} (${SHORT_SHA})" >> .env.production.local

          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
